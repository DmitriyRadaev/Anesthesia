name: anesthesia

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-anesthesia}
      POSTGRES_USER: ${POSTGRES_USER:-anesthesia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.utf8"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "${POSTGRES_PUBLISHED_PORT:-5432}:5432"

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PUBLISHED_PORT:-8000}:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PUBLISHED_PORT:-8080}:80"

  # Приём HL7-сообщений от шлюза мониторов (eGateway). Запуск: docker compose --profile hl7 up -d
  hl7:
    build: ./backend
    restart: unless-stopped
    profiles: ["hl7"]
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      RUN_MIGRATIONS: "0"
    command: ["python", "manage.py", "hl7_listener"]
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    ports:
      - "${HL7_PUBLISHED_PORT:-6112}:6112"

volumes:
  pgdata:
