        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: search_surname
        schema:
          type: string
        description: Начало фамилии (без учёта регистра)
