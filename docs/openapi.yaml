openapi: 3.0.3
info:
  title: АРМ Анестезиология — REST API
  version: 2.0.0
  description: 'API системы ведения протокола анестезии и наркозной карты. Авторизация:
    `POST /api/auth/login/` → заголовок `Authorization: Bearer <token>`.'
paths:
  /api/auth/change-password/:
    post:
      operationId: auth_change_password_create
      summary: Смена собственного пароля
      tags:
      - Авторизация
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      security:
      - BearerAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/login/:
    post:
      operationId: auth_login_create
      summary: Вход в систему
      tags:
      - Авторизация
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
        '400':
          description: Не заполнены поля
        '401':
          description: Неверный логин или пароль
        '403':
          description: Учётная запись деактивирована
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      summary: Выход (отзыв текущего токена)
      tags:
      - Авторизация
      security:
      - BearerAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      summary: Текущий пользователь
      tags:
      - Авторизация
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/catalogs/:
    get:
      operationId: catalogs_index
      summary: Перечень доступных справочников
      tags:
      - Справочники
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CatalogIndex'
          description: ''
  /api/catalogs/{slug}/:
    get:
      operationId: catalogs_items
      description: 'Доступные slug: anesthesia_method, anesthesia_specificity, anesthesia_type,
        asa, blade_number, blade_type, blood_group, blood_rh, catheter_diameter, catheter_type,
        combi_tube_size, department, department_name, department_picked, department_type,
        diagnosis, doctor_fio, intubation_tube_size, intuboscope_cuff_size, intuboscope_cuff_type,
        laryngeal_mask_type, measurement_units, monitoring, oropharyngeal_catheter,
        oxygen_mask_size, patient_status, pressure_type, rass, scale_glazgo, scale_glazgo_head,
        scale_meyo, scale_meyo_head, sex, tube_type, type_operation, vein_cvc, vein_pvc,
        ventilator, volume_operation. Для `department` обязателен параметр `department_type_id`;
        для `scale_glazgo`/`scale_meyo` можно передать `head_id`; для `anesthesia_method`
        — `type`.'
      summary: Элементы справочника
      parameters:
      - in: query
        name: department_type_id
        schema:
          type: integer
      - in: query
        name: head_id
        schema:
          type: integer
      - in: path
        name: slug
        schema:
          type: string
          enum:
          - anesthesia_method
          - anesthesia_specificity
          - anesthesia_type
          - asa
          - blade_number
          - blade_type
          - blood_group
          - blood_rh
          - catheter_diameter
          - catheter_type
          - combi_tube_size
          - department
          - department_name
          - department_picked
          - department_type
          - diagnosis
          - doctor_fio
          - intubation_tube_size
          - intuboscope_cuff_size
          - intuboscope_cuff_type
          - laryngeal_mask_type
          - measurement_units
          - monitoring
          - oropharyngeal_catheter
          - oxygen_mask_size
          - patient_status
          - pressure_type
          - rass
          - scale_glazgo
          - scale_glazgo_head
          - scale_meyo
          - scale_meyo_head
          - sex
          - tube_type
          - type_operation
          - vein_cvc
          - vein_pvc
          - ventilator
          - volume_operation
        required: true
      - in: query
        name: type
        schema:
          type: string
      tags:
      - Справочники
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CatalogItem'
          description: ''
  /api/cdss/result/{operation_id}/:
    get:
      operationId: cdss_result_retrieve
      description: 'Доступ: токен клинического пользователя или заголовок `X-API-Key`
        (INTEGRATION_API_KEY).'
      summary: Последние показатели пациента для СППВР (CDSS)
      parameters:
      - in: path
        name: operation_id
        schema:
          type: integer
        required: true
      tags:
      - Мониторинг (HL7)
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/health/:
    get:
      operationId: health_retrieve
      summary: Проверка работоспособности (API + БД)
      tags:
      - Служебное
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/medicaments/:
    get:
      operationId: medicaments_list
      description: '`search_name` — начало наименования (без учёта регистра); пагинация
        по 20.'
      summary: Поиск медикаментов
      parameters:
      - in: query
        name: group
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: search_name
        schema:
          type: string
        description: Начало наименования
      tags:
      - Медикаменты
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMedicamentList'
          description: ''
  /api/medicaments/{id}/:
    get:
      operationId: medicaments_retrieve
      summary: Медикамент
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this медикамент.
        required: true
      tags:
      - Медикаменты
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Medicament'
          description: ''
  /api/monitoring/hl7/:
    post:
      operationId: monitoring_hl7_create
      description: 'Тело: `{"message": "MSH|...\rPID|...\rOBR|...\rOBX|..."}`. Доступ:
        `X-API-Key` или пользователь с ролью заведующего/ИО.'
      summary: Принять HL7-сообщение (ORU^R01)
      tags:
      - Мониторинг (HL7)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HL7IngestRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/HL7IngestRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/HL7IngestRequestRequest'
        required: true
      security:
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HL7Result'
          description: ''
  /api/monitoring/pids/:
    get:
      operationId: monitoring_pids_retrieve
      summary: PID, от которых поступали данные за последние N минут (по умолчанию
        10)
      parameters:
      - in: query
        name: minutes
        schema:
          type: integer
      tags:
      - Мониторинг (HL7)
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecentPids'
          description: ''
  /api/operations/:
    get:
      operationId: operations_list
      description: Операционные случаи. Удаление ОС не предусмотрено (как в исходной
        системе) — используйте отмену.
      summary: Список операционных случаев (фильтры, поиск, сортировка, пагинация)
      parameters:
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - in: query
        name: doctor
        schema:
          type: integer
      - in: query
        name: mine
        schema:
          type: boolean
        description: Только ОС, где пользователь — врач или медсестра
      - in: query
        name: nurse
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: patient
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
      - in: query
        name: type_operation
        schema:
          type: integer
      tags:
      - Операционные случаи
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOperationList'
          description: ''
    post:
      operationId: operations_create
      description: Операционные случаи. Удаление ОС не предусмотрено (как в исходной
        системе) — используйте отмену.
      summary: Создать операционный случай
      tags:
      - Операционные случаи
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OperationWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OperationWriteRequest'
        required: true
      security:
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
          description: ''
  /api/operations/{operation_id}/card/actions/:
    get:
      operationId: operations_card_actions_list
      description: Набор строк, принадлежащих ОС. PUT полностью заменяет набор (как
        PATCH исходной системы).
      summary: Анестезиологические действия
      parameters:
      - in: path
        name: operation_id
        schema:
          type: integer
        required: true
      tags:
      - Наркозная карта
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AnestheticAction'
          description: ''
    put:
      operationId: operations_card_actions_update
      description: 'Полная замена набора. Пересчитывает статус ОС: «Начало анестезии»
        → НА ОПЕРАЦИИ, иначе ПОСТУПИЛ (для незавершённых и неотменённых ОС); карточка
        пациента становится АКТИВНОЙ.'
      summary: Заменить анестезиологические действия
      parameters:
      - in: path
        name: operation_id
        schema:
          type: integer
        required: true
      tags:
      - Наркозная карта
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/AnestheticActionRequest'
          application/x-www-form-urlencoded:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/AnestheticActionRequest'
          multipart/form-data:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/AnestheticActionRequest'
        required: true
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AnestheticAction'
          description: ''
  /api/operations/{operation_id}/card/breath/:
    get:
      operationId: operations_card_breath_retrieve
      description: Находит ОС по `operation_id` (404, если не найден). Доступ — клинический
        персонал.
      summary: Характеристики дыхания
      parameters:
      - in: path
        name: operation_id
        schema:
          type: integer
        required: true
      tags:
      - Наркозная карта
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BreathCharacteristics'
          description: ''
    put:
      operationId: operations_card_breath_update
      description: Находит ОС по `operation_id` (404, если не найден). Доступ — клинический
        персонал.
      summary: Заменить характеристики дыхания
      parameters:
      - in: path
        name: operation_id
        schema:
          type: integer
        required: true
      tags:
      - Наркозная карта
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BreathCharacteristicsRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BreathCharacteristicsRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BreathCharacteristicsRequest'
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BreathCharacteristics'
          description: ''
  /api/operations/{operation_id}/card/cms/:
    get:
      operationId: operations_card_cms_retrieve
      description: 'Окно: от времени поступления −5 минут до «Окончания анестезии»
        (или текущего момента), не более 24 часов. Для каждого интервала берётся последнее
        сообщение монитора.'
      summary: Показатели мониторов для блока ЦМС (интервалы по 5 минут)
      parameters:
      - in: path
        name: operation_id
        schema:
          type: integer
        required: true
      tags:
      - Наркозная карта
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/operations/{operation_id}/card/drugs/{section}/:
    get:
      operationId: operations_card_drugs_list
      description: 'Набор строк, сгруппированных по наименованию: ``[{<group_field>:
        "...", "items": [...]}, ...]``.'
      summary: Препараты раздела
      parameters:
      - in: path
        name: operation_id
        schema:
          type: integer
        required: true
      - in: path
        name: section
        schema:
          type: string
          enum:
          - introduction
          - maintenance
          - premedication
        description: premedication — премедикация, introduction — введение в анестезию,
          maintenance — поддержание анестезии
        required: true
      tags:
      - Наркозная карта
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DrugGroup'
          description: ''
    put:
      operationId: operations_card_drugs_update
      description: 'Набор строк, сгруппированных по наименованию: ``[{<group_field>:
        "...", "items": [...]}, ...]``.'
      summary: Заменить препараты раздела
      parameters:
      - in: path
        name: operation_id
        schema:
          type: integer
        required: true
      - in: path
        name: section
        schema:
          type: string
          enum:
          - introduction
          - maintenance
          - premedication
        description: premedication — премедикация, introduction — введение в анестезию,
          maintenance — поддержание анестезии
        required: true
      tags:
      - Наркозная карта
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/DrugGroupRequest'
          application/x-www-form-urlencoded:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/DrugGroupRequest'
          multipart/form-data:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/DrugGroupRequest'
        required: true
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DrugGroup'
          description: ''
  /api/operations/{operation_id}/card/drugs/totals/:
    get:
      operationId: operations_card_drugs_totals_list
      description: Находит ОС по `operation_id` (404, если не найден). Доступ — клинический
        персонал.
      summary: Итоговые дозы препаратов (по всем разделам)
      parameters:
      - in: path
        name: operation_id
        schema:
          type: integer
        required: true
      tags:
      - Наркозная карта
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DoseTotal'
          description: ''
  /api/operations/{operation_id}/card/infusions/:
    get:
      operationId: operations_card_infusions_list
      description: 'Набор строк, сгруппированных по наименованию: ``[{<group_field>:
        "...", "items": [...]}, ...]``.'
      summary: Инфузионная терапия
      parameters:
      - in: path
        name: operation_id
        schema:
          type: integer
        required: true
      tags:
      - Наркозная карта
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InfusionGroup'
          description: ''
    put:
      operationId: operations_card_infusions_update
      description: 'Набор строк, сгруппированных по наименованию: ``[{<group_field>:
        "...", "items": [...]}, ...]``.'
      summary: Заменить инфузионную терапию
      parameters:
      - in: path
        name: operation_id
        schema:
          type: integer
        required: true
      tags:
      - Наркозная карта
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/InfusionGroupRequest'
          application/x-www-form-urlencoded:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/InfusionGroupRequest'
          multipart/form-data:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/InfusionGroupRequest'
        required: true
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InfusionGroup'
          description: ''
  /api/operations/{operation_id}/card/liquids/:
    get:
      operationId: operations_card_liquids_list
      description: 'Набор строк, сгруппированных по наименованию: ``[{<group_field>:
        "...", "items": [...]}, ...]``.'
      summary: Жидкостные потери
      parameters:
      - in: path
        name: operation_id
        schema:
          type: integer
        required: true
      tags:
      - Наркозная карта
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LiquidGroup'
          description: ''
    put:
      operationId: operations_card_liquids_update
      description: 'Набор строк, сгруппированных по наименованию: ``[{<group_field>:
        "...", "items": [...]}, ...]``.'
      summary: Заменить жидкостные потери
      parameters:
      - in: path
        name: operation_id
        schema:
          type: integer
        required: true
      tags:
      - Наркозная карта
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/LiquidGroupRequest'
          application/x-www-form-urlencoded:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/LiquidGroupRequest'
          multipart/form-data:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/LiquidGroupRequest'
        required: true
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LiquidGroup'
          description: ''
  /api/operations/{operation_id}/card/patient-info/:
    get:
      operationId: operations_card_patient_info_retrieve
      description: Находит ОС по `operation_id` (404, если не найден). Доступ — клинический
        персонал.
      summary: Сведения о пациенте и операции в наркозной карте
      parameters:
      - in: path
        name: operation_id
        schema:
          type: integer
        required: true
      tags:
      - Наркозная карта
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardPatientInfo'
          description: ''
